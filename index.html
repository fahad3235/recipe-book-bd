<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Book BD — রেসিপি বুক বিডি</title>
<meta name="description" content="235+ offline Bangladeshi recipes, bilingual EN/বাংলা. No internet needed.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">🍛</span>
    <div>
      <h1 id="appTitle">Recipe Book BD</h1>
      <p id="appSub" class="sub">235+ Bangladeshi recipes · offline</p>
    </div>
  </div>
  <div class="top-actions">
    <button id="langToggle" class="btn pill" type="button">বাংলা</button>
    <button id="favViewBtn" class="btn pill" type="button">❤ <span id="favCount">0</span></button>
  </div>
</header>

<main>
  <section class="controls">
    <input id="search" type="search" autocomplete="off"
           placeholder="Search recipes or ingredients… / রেসিপি বা উপকরণ খুঁজুন…"
           aria-label="Search recipes">
    <div class="filters">
      <select id="catFilter" aria-label="Category filter"></select>
      <select id="diffFilter" aria-label="Difficulty filter"></select>
      <select id="timeFilter" aria-label="Max time filter"></select>
      <button id="exportBtn" class="btn small" type="button">⤓ <span data-i18n="export">Export</span></button>
      <label class="btn small file-label" for="importFile">⤒ <span data-i18n="import">Import</span></label>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
  </section>

  <p id="resultCount" class="result-count" aria-live="polite"></p>
  <section id="grid" class="grid" aria-label="Recipes"></section>
  <p id="emptyState" class="empty hidden"></p>
</main>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <button id="modalClose" class="modal-close" type="button" aria-label="Close">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalMeta" class="meta-row"></div>
    <button id="modalFav" class="btn pill" type="button"></button>
    <h3 id="ingHeading"></h3>
    <ul id="modalIng" class="ing-list"></ul>
    <h3 id="stepsHeading"></h3>
    <ol id="modalSteps" class="steps-list"></ol>
  </div>
</div>

<footer>
  <p id="footText"></p>
</footer>

<script src="js/recipes-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
